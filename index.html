<!DOCTYPE html>
<html lang="pt-BR">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ficha Fabula Ultima</title>
    <link rel="stylesheet" href="base-style.css">
    <link rel="stylesheet" href="jan-atributos.css">
    <link rel="stylesheet" href="jan-barras.css">
    </head>
    <body>
        <div>
            Janela de Status
            <div class="container">
                <h2>Atributos:</h2>
                <div class="atrib-container">
                    <div class="atrib-box">
                        Vigor.
                        <select>
                            <option selected>d6</option>
                            <option>d8</option>
                            <option>d10</option>
                            <option>d12</option>
                        </select>
                    </div>
                    <div class="atrib-box">
                        Destreza.
                        <select>
                            <option selected>d6</option>
                            <option>d8</option>
                            <option>d10</option>
                            <option>d12</option>
                        </select>
                    </div>
                    <div class="atrib-box">
                        <label> Vontade </label>
                        <select>
                            <option selected>d6</option>
                            <option>d8</option>
                            <option>d10</option>
                            <option>d12</option>
                        </select>
                    </div>
                    <div class="atrib-box">
                        Astucia
                        <select>
                            <option selected>d6</option>
                            <option >d6</option>
                            <option>d8</option>
                            <option>d10</option>
                            <option>d12</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="container">
                <h2>Status Derivados:</h2>
                <span> Atual / Máximo </span>
                <div class="cont-barra">
                    <button>-</button>
                    <div class="barra-vazia">
                        <div class="barra-cheia vida">
                        </div>
                    </div>
                    <button>+</button>
                </div>

                <span> Atual / Máximo </span>
                <div class="cont-barra">
                    <button>-</button>
                    <div class="barra-vazia">
                        <div class="barra-cheia mana">
                        </div>
                    </div>
                    <button>+</button>
                </div>

                <span> Atual / Máximo </span>
                <div class="cont-barra">
                    <button>-</button>
                    <div class="barra-vazia">
                        <div class="barra-cheia inve">
                        </div>
                    </div>
                    <button>+</button>
                </div>
                <div class="container">
                    Caixa com Itens utilizaveis: 
                    <button>Remedio 3 IP : Cura 50 Pvs</button>
                    <button>Elixir 3 IP : Cura 50 Manas</button>
                    <button>Tônico 2 IP : Cura uma Condição</button>
                </div>
                Defesa: Valor
                Defesa Mágica: Valor

                Pontos de Fabula.
            </div>
        </div>
    </body>
</html>
